[package]
name = "meeting-intelligence-workspace"
version = "0.1.0"
description = "Meeting Intelligence Workspace desktop foundation"
edition = "2021"

[lib]
name = "meeting_intelligence_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
